name: Validate JEV foundation

on:
  pull_request:
  push:
    branches:
      - main
      - jev-v7-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml pytest
      - run: python scripts/validate_skills.py
      - run: python scripts/validate_backlog.py
      - run: python scripts/validate_contract_consistency.py
      - run: python scripts/validate_docs_consistency.py
      - run: python scripts/validate_foundation_release.py
      - name: Collect real changed paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_paths.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" > /tmp/changed_paths.txt
            else
              git diff --no-renames --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed_paths.txt
            fi
          fi
          test -s /tmp/changed_paths.txt
          cat /tmp/changed_paths.txt
      - name: Resolve declared risk
        id: declared_risk
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DECLARED_RISK="$(printf '%s\n' "$PR_BODY" | sed -nE 's/^[[:space:]]*JEV-RISK:[[:space:]]*(R[0-4])[[:space:]]*$/\1/p' | head -n1)"
            if [ -z "$DECLARED_RISK" ]; then
              echo "PR body must contain a line like: JEV-RISK: R3" >&2
              exit 1
            fi
          else
            # Push validation is informational about classification; merges are enforced on PRs.
            DECLARED_RISK="R4"
          fi
          echo "risk=$DECLARED_RISK" >> "$GITHUB_OUTPUT"
      - run: python scripts/validate_changed_paths_risk.py --paths-file /tmp/changed_paths.txt --declared-risk "${{ steps.declared_risk.outputs.risk }}"
      - run: python scripts/validate_security_defaults.py
      - run: pytest -q
      - run: python scripts/plan_task.py --task-id CI-SMOKE --triggers auth,backend,api,implementation --flags auth_or_authorization_change
      - name: Verify main branch protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROTECTED="$(gh api "repos/${{ github.repository }}/branches/main" --jq '.protected')"
          if [ "$PROTECTED" != "true" ]; then
            echo "main branch must be protected before Foundation is release-ready" >&2
            exit 1
          fi
