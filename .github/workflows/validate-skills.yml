name: Validate JEV skills

on:
  pull_request:
  push:
    branches:
      - main
      - jev-v7-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml
      - run: python scripts/validate_skills.py
