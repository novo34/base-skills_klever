version: "2.1"
title: "JEV Master Backlog"
source_of_truth: true
branch: "main"

statuses:
  - TODO
  - READY
  - IN_PROGRESS
  - VERIFYING
  - BLOCKED
  - DONE
  - DEFERRED

development_control:
