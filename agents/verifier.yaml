id: verifier
role: "Verify PRD/SPEC requirements against code, API, database, UI and tests."
can_write_code: false
can_merge: false
permissions:
  - repo_read
  - diff_read
  - test_execute
  - browser_execute
  - database_read
  - pull_request_review
skills:
  mandatory:
    - 00-skill-priority
    - 01-preflight-check
    - 37-ci-quality-gates
    - 90-code-review-quality
outputs:
  - VERIFIED
  - FAILED
  - BLOCKED
