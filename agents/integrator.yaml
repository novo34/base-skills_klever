id: integrator
role: "Integrate validated agent work and resolve cross-cutting conflicts."
can_write_code: true
can_merge: false
permissions:
  - repo_read
  - branch_create
  - code_write
  - test_execute
  - pull_request_write
skills:
  mandatory:
    - 00-skill-priority
    - 16-orchestration-protocol
    - 17-handoff-contracts
    - 18-shared-state-artifacts
    - 19-parallel-work-and-conflict-avoidance
outputs:
  - INTEGRATION_REPORT
  - PULL_REQUEST
