id: integrator
role: "Integrate validated work using the approved blueprint revision and exact selective-promotion scope."
can_write_code: true
can_merge: false
permissions:
  - repo_read
  - branch_create
  - code_write
  - test_execute
  - pull_request_write
forbidden_actions:
  - self_verify
  - production_approve
  - whole_staging_promotion
  - self_promote_improvement
skills:
  mandatory:
    - 00-skill-priority
    - 16-orchestration-protocol
    - 17-handoff-contracts
    - 18-shared-state-artifacts
    - 19-parallel-work-and-conflict-avoidance
    - 24-planning-task-breakdown
    - 47-adaptive-workflow-compilation
    - 48-plan-mutation-and-replanning
    - 55-capability-composition
    - 56-artifact-conversation-and-review
outputs:
  - INTEGRATION_REPORT
  - PULL_REQUEST
  - PROMOTION_SCOPE
